AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Labra customer onboarding role. Creates an IAM role trusted by the Labra platform
  principal with ExternalId protection for sts:AssumeRole.

Parameters:
  RoleName:
    Type: String
    Default: LabraCustomerDeployRole
    Description: Name for the IAM role Labra will assume in this customer account.
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"

  PlatformPrincipalArn:
    Type: String
    Description: IAM role ARN in the Labra platform account allowed to call sts:AssumeRole.
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:role\\/[A-Za-z0-9+=,.@_\\/-]+$"

  ExternalId:
    Type: String
    Description: External ID provided by Labra for confused-deputy protection.
    MinLength: 8
    MaxLength: 128
    AllowedPattern: "^[A-Za-z0-9+=,.@:\\/_-]+$"

  ResourcePrefix:
    Type: String
    Description: Prefix for Labra-managed static app resources in this account.
    Default: labra-
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[a-z0-9-]+$"

  ManagedPolicyArnsCsv:
    Type: String
    Description: Optional comma-separated managed policy ARNs to attach in addition to Labra's inline least-privilege policy.
    Default: ""

  MaxSessionDurationSeconds:
    Type: Number
    Description: Maximum STS session duration in seconds.
    Default: 3600
    MinValue: 3600
    MaxValue: 43200

  PermissionsBoundaryArn:
    Type: String
    Description: Optional permissions boundary ARN for this role. Leave blank to disable.
    Default: ""

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasManagedPolicyArns: !Not [!Equals [!Ref ManagedPolicyArnsCsv, ""]]

Resources:
  LabraCustomerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLabraPlatformAssumeRole
            Effect: Allow
            Principal:
              AWS: !Ref PlatformPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns: !If [HasManagedPolicyArns, !Split [",", !Ref ManagedPolicyArnsCsv], !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: LabraStaticDeployLeastPrivilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ValidateCallerIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
              - Sid: CreateBucketsForLabraApps
                Effect: Allow
                Action:
                  - s3:CreateBucket
                Resource: "*"
              - Sid: ManageLabraBuckets
                Effect: Allow
                Action:
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketWebsite
                  - s3:PutBucketWebsite
                  - s3:DeleteBucketWebsite
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !Sub "arn:aws:s3:::${ResourcePrefix}*"
              - Sid: ManageLabraBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub "arn:aws:s3:::${ResourcePrefix}*/*"
              - Sid: CreateAndListCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:ListDistributions
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:ListOriginAccessControls
                Resource: "*"
              - Sid: ManageCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                Resource:
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Project
          Value: labra-customer-onboarding
        - Key: Purpose
          Value: cross-account-assume-role

Outputs:
  CustomerRoleArn:
    Description: ARN to provide back to Labra in AWS connection settings.
    Value: !GetAtt LabraCustomerRole.Arn

  CustomerRoleName:
    Description: Name of the role created for Labra.
    Value: !Ref LabraCustomerRole

  CustomerAccountId:
    Description: AWS account ID where this role was created.
    Value: !Ref AWS::AccountId
