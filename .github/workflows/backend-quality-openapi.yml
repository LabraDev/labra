name: Backend Quality + OpenAPI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'labra-backend/**'
      - '.github/workflows/backend-quality-openapi.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labra-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: labra-backend/go.mod

      - name: Go Vet
        run: go vet ./...

      - name: Unit Tests
        run: go test ./...

      - name: Race Tests
        run: go test -race ./...

      - name: Generate OpenAPI Artifact
        run: ./scripts/generate-openapi.sh

      - name: Upload OpenAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labra-openapi-json
          path: labra-backend/dist/openapi.json
          if-no-files-found: error
